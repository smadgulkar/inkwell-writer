[package]
name = "inkwell"
version = "0.7.0"
description = "A writing studio for short stories and novels"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/smadgulkar/inkwell-writer"

[lib]
name = "inkwell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
