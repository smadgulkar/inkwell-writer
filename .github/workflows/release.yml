name: Release

# Push a tag like v0.8.0 (or run this by hand from the Actions tab) to build installers for
# Windows (.exe, .msi), macOS (universal .dmg) and Linux (.AppImage, .deb, .rpm).
# They are attached to a draft GitHub release; check it, then press "Publish release".

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm install
      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v__VERSION__-build{0}', github.run_number) }}
          releaseName: 'Inkwell v__VERSION__'
          releaseBody: |
            A free, open-source writing studio for novels and short stories.

            **Which file do I need?**
            - **Windows 10/11:** `Inkwell_*_x64-setup.exe` (or the `.msi`)
            - **macOS:** `Inkwell_*_universal.dmg` (Apple silicon and Intel)
            - **Linux:** `.AppImage` (any distro), `.deb` (Debian/Ubuntu) or `.rpm` (Fedora)

            These builds are not code-signed yet. On Windows choose **More info → Run anyway**; on macOS right-click the app and choose **Open** (if it says the app is damaged, run `xattr -cr /Applications/Inkwell.app`). See the README for details.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
